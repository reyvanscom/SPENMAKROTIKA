<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 500 500" width="100%" height="100%" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <defs>
    <!-- Soft shadow filter -->
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.3" />
    </filter>
    
    <!-- Torch Flame Gradient -->
    <linearGradient id="flame-grad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#DC2626" />
      <stop offset="40%" stop-color="#EA580C" />
      <stop offset="80%" stop-color="#FACC15" />
      <stop offset="100%" stop-color="#FEF08A" />
    </linearGradient>

    <!-- Golden Pen Nib Gradient -->
    <linearGradient id="gold-nib" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#CA8A04" />
      <stop offset="50%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#A16207" />
    </linearGradient>

    <!-- Star Silver Shading -->
    <linearGradient id="silver-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E5E7EB" />
    </linearGradient>
    <linearGradient id="silver-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9CA3AF" />
      <stop offset="100%" stop-color="#4B5563" />
    </linearGradient>

    <!-- Text Arc Path for SEKOLAH MENENGAH PERTAMA NEGERI 5 (Radius 106 around cy=235) -->
    <path id="text-arc" d="M 125 242 A 125 125 0 1 1 375 242" fill="none" />
  </defs>

  <!-- PENTAGON OUTER BORDERS (Exact School Badge Crest) -->
  <!-- Outer thick black border -->
  <polygon points="250,12 458,162 380,462 120,462 42,162" fill="#000000" />
  <!-- White middle border -->
  <polygon points="250,20 448,166 372,454 128,454 52,166" fill="#FFFFFF" />
  <!-- Inner black border line -->
  <polygon points="250,26 442,170 368,448 132,448 58,170" fill="#000000" />
  <!-- Pentagon Blue Base Fill (SMPN 5 Kroya Royal Blue) -->
  <polygon points="250,32 436,174 364,442 136,442 64,174" fill="#1D63EA" />

  <!-- TOP SILVER STAR WITH 3D BEVELS -->
  <g transform="translate(250, 80)">
    <!-- Top point -->
    <polygon points="0,0 0,-26 6.8,-8.5" fill="url(#silver-dark)" />
    <polygon points="0,0 0,-26 -6.8,-8.5" fill="url(#silver-light)" />
    <!-- Top Right point -->
    <polygon points="0,0 24.7,-8 11,3.9" fill="url(#silver-dark)" />
    <polygon points="0,0 24.7,-8 6.8,-8.5" fill="url(#silver-light)" />
    <!-- Bottom Right point -->
    <polygon points="0,0 15.3,21.1 0,10.4" fill="url(#silver-dark)" />
    <polygon points="0,0 15.3,21.1 11,3.9" fill="url(#silver-light)" />
    <!-- Bottom Left point -->
    <polygon points="0,0 -15.3,21.1 -11,3.9" fill="url(#silver-dark)" />
    <polygon points="0,0 -15.3,21.1 0,10.4" fill="url(#silver-light)" />
    <!-- Top Left point -->
    <polygon points="0,0 -24.7,-8 -6.8,-8.5" fill="url(#silver-dark)" />
    <polygon points="0,0 -24.7,-8 -11,3.9" fill="url(#silver-light)" />
    <!-- Star outline -->
    <polygon points="0,-26 6.8,-8.5 24.7,-8 11,3.9 15.3,21.1 0,10.4 -15.3,21.1 -11,3.9 -24.7,-8 -6.8,-8.5" fill="none" stroke="#1F2937" stroke-width="1.2" />
  </g>

  <!-- CIRCULAR EMBLEM OUTER TRACK -->
  <!-- Blue base circle with black and white border (cy=236, r=120) -->
  <circle cx="250" cy="236" r="120" fill="#1347B8" stroke="#000000" stroke-width="4" />
  <circle cx="250" cy="236" r="116" fill="none" stroke="#FFFFFF" stroke-width="2.5" />
  <circle cx="250" cy="236" r="95" fill="none" stroke="#000000" stroke-width="3" />
  <circle cx="250" cy="236" r="92" fill="none" stroke="#FFFFFF" stroke-width="2" />

  <!-- ARCHED TEXT: SEKOLAH MENENGAH PERTAMA NEGERI 5 -->
  <text font-family="'Plus Jakarta Sans', Arial, Helvetica, sans-serif" font-weight="900" font-size="14.8" fill="#FFFFFF" letter-spacing="1">
    <textPath href="#text-arc" xlink:href="#text-arc" startOffset="50%" text-anchor="middle">
      SEKOLAH MENENGAH PERTAMA NEGERI 5
    </textPath>
  </text>

  <!-- INNER EMBLEM: YELLOW ORNAMENT & 8-POINT GREEN STAR -->
  <g transform="translate(250, 236)">
    <!-- Yellow Ring Base -->
    <circle cx="0" cy="0" r="90" fill="#FACC15" stroke="#000000" stroke-width="4" />
    
    <!-- 8-Pointed Star Notch Pattern (Islamic Rub el Hizb / 8-pointed star ornament) -->
    <!-- Two overlapping rotated squares (Yellow with black stroke) -->
    <rect x="-62" y="-62" width="124" height="124" fill="#EAB308" stroke="#000000" stroke-width="3" rx="2" />
    <rect x="-62" y="-62" width="124" height="124" fill="#EAB308" stroke="#000000" stroke-width="3" rx="2" transform="rotate(45)" />

    <!-- Central Green 8-Pointed Star Shape -->
    <!-- Square 1 (Green) -->
    <rect x="-54" y="-54" width="108" height="108" fill="#0D8841" stroke="#FFFFFF" stroke-width="2.5" rx="1" />
    <!-- Square 2 rotated 45 deg (Green) -->
    <rect x="-54" y="-54" width="108" height="108" fill="#0D8841" stroke="#FFFFFF" stroke-width="2.5" rx="1" transform="rotate(45)" />
    <!-- Outer black contour on green star -->
    <rect x="-54" y="-54" width="108" height="108" fill="none" stroke="#000000" stroke-width="1.2" />
    <rect x="-54" y="-54" width="108" height="108" fill="none" stroke="#000000" stroke-width="1.2" transform="rotate(45)" />

    <!-- OPEN BOOK (Buku Terbuka Pengetahuan) -->
    <g transform="translate(0, 16)">
      <!-- Book spine & Blue hard cover edges -->
      <path d="M -50 -15 L -50 25 Q -25 32 0 21 Q 25 32 50 25 L 50 -15 Q 25 -8 0 -18 Q -25 -8 -50 -15 Z" fill="#1E3A8A" stroke="#000000" stroke-width="2.2" />
      
      <!-- Left Page (White) -->
      <path d="M -47 -13 L -47 22 Q -24 29 -2 19 L -2 -16 Q -24 -6 -47 -13 Z" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" />
      <!-- Left Page lines (text lines) -->
      <line x1="-42" y1="-6" x2="-7" y2="4" stroke="#4B5563" stroke-width="1.5" />
      <line x1="-42" y1="0" x2="-7" y2="10" stroke="#4B5563" stroke-width="1.5" />
      <line x1="-42" y1="6" x2="-7" y2="16" stroke="#4B5563" stroke-width="1.5" />
      <line x1="-42" y1="12" x2="-12" y2="20" stroke="#4B5563" stroke-width="1.5" />

      <!-- Right Page (White) -->
      <path d="M 47 -13 L 47 22 Q 24 29 2 19 L 2 -16 Q 24 -6 47 -13 Z" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" />
      <!-- Right Page lines (text lines) -->
      <line x1="7" y1="4" x2="42" y2="-6" stroke="#4B5563" stroke-width="1.5" />
      <line x1="7" y1="10" x2="42" y2="0" stroke="#4B5563" stroke-width="1.5" />
      <line x1="7" y1="16" x2="42" y2="6" stroke="#4B5563" stroke-width="1.5" />
      <line x1="12" y1="20" x2="42" y2="12" stroke="#4B5563" stroke-width="1.5" />

      <!-- Book Center Spine line -->
      <line x1="0" y1="-18" x2="0" y2="20" stroke="#000000" stroke-width="2" />
    </g>

    <!-- TORCH FLAME AND PEN (Obor & Mata Pena) -->
    <g transform="translate(0, 0)">
      <!-- 1. VIBRANT BURNING FLAME (Obor Api) -->
      <path d="M 0 -60 C 12 -48 18 -36 12 -23 C 8 -18 5 -15 0 -13 C -5 -15 -8 -18 -12 -23 C -18 -36 -12 -48 0 -60 Z" fill="url(#flame-grad)" stroke="#000000" stroke-width="1.8" />
      <!-- Inner Flame Core (Yellow) -->
      <path d="M 0 -52 C 6 -43 10 -35 6 -26 C 3 -21 2 -18 0 -16 C -2 -18 -3 -21 -6 -26 C -10 -35 -6 -43 0 -52 Z" fill="#FEF08A" opacity="0.95" />

      <!-- 2. RED TORCH CUP / COLLAR -->
      <path d="M -8 -13 L 8 -13 L 6 -7 L -6 -7 Z" fill="#DC2626" stroke="#000000" stroke-width="1.8" />

      <!-- 3. TORCH CYLINDER / PEN SHAFT (Black) -->
      <rect x="-4.5" y="-7" width="9" height="35" fill="#111827" stroke="#000000" stroke-width="1.8" rx="1" />
      <!-- Silver ring on pen -->
      <rect x="-5" y="7" width="10" height="2.5" fill="#E5E7EB" stroke="#000000" stroke-width="0.8" />

      <!-- 4. FOUNTAIN PEN NIB (Mata Pena Emas menunjuk ke bawah) -->
      <path d="M -5.5 28 L 5.5 28 L 6 32 L 0 45 L -6 32 Z" fill="url(#gold-nib)" stroke="#000000" stroke-width="1.8" />
      <!-- Nib Breather Hole -->
      <circle cx="0" cy="34" r="1.2" fill="#000000" />
      <!-- Nib Slit line to tip -->
      <line x1="0" y1="35" x2="0" y2="44" stroke="#000000" stroke-width="1.2" />
    </g>
  </g>

  <!-- LOWER BANNER TEXT: 1991 & KROYA -->
  <!-- 1991 (Tahun Berdiri) -->
  <text x="250" y="394" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="26" fill="#FFFFFF" letter-spacing="3" stroke="#000000" stroke-width="1.2" paint-order="stroke fill">
    1991
  </text>

  <!-- KROYA -->
  <text x="250" y="430" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="31" fill="#FFFFFF" letter-spacing="4" stroke="#000000" stroke-width="1.5" paint-order="stroke fill">
    KROYA
  </text>
</svg>
